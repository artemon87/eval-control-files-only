apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-control-center
  labels:
    app.kubernetes.io/name: eval-control-center
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eval-control-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eval-control-center
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: your-registry/eval-control-center:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_EVAL_API_URL
              value: https://eval-api.example.com/api/v1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: wrangler
              mountPath: /app/.wrangler
      volumes:
        - name: tmp
          emptyDir: {}
        - name: wrangler
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eval-control-center
spec:
  selector:
    app.kubernetes.io/name: eval-control-center
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eval-control-center
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eval-control-center
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eval-control-center
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eval-control-center
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
